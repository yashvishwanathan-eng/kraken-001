# Demo zones, loaded into the database by:  python -m app.seed
# Polygon points are fractions of the frame: x from 0 (left) to 1 (right), y from 0 (top) to 1 (bottom).
# A person counts as "in" a zone when their FEET (bottom-centre of the box) are inside it.
# kind: restricted (access rule), ppe (helmet/vest rule), work (loitering and crowding only)
# max_people: crowding threshold N for that zone (leave out for no crowding check)
# Falls, unattended bags and fire/smoke are checked on the whole frame; they need no zone.
# After the cameras are placed, adjust these numbers to the real view (docs/DEMO_SETUP.md, step 6).
zones:
  cam-door:
    # the floor just in front of the door: the middle of the lower half of the picture
    - name: server-room-door
      kind: restricted
      polygon: [[0.30, 0.50], [0.70, 0.50], [0.70, 1.00], [0.30, 1.00]]
  cam-floor:
    # the open floor where the fall and the left bag are shown; loitering here after 2 minutes
    - name: shop-floor
      kind: work
      polygon: [[0.00, 0.35], [1.00, 0.35], [1.00, 1.00], [0.00, 1.00]]
  cam-entrance:
    # the whole picture: more than 3 people at once = crowding
    - name: entrance
      kind: work
      polygon: [[0.00, 0.00], [1.00, 0.00], [1.00, 1.00], [0.00, 1.00]]
      max_people: 3
    # right half: helmet and vest check (works once a PPE model is set)
    - name: helmet-area
      kind: ppe
      polygon: [[0.50, 0.00], [1.00, 0.00], [1.00, 1.00], [0.50, 1.00]]
  cam-webcam:
    - name: test-zone
      kind: restricted
      polygon: [[0.60, 0.55], [1.00, 0.55], [1.00, 1.00], [0.60, 1.00]]
