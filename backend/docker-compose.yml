# Runs PostgreSQL in Docker, so the database is the same on every machine.
# Start:  docker compose up -d        Stop:  docker compose down        (data is kept in the pgdata volume)
# Use the same user, password and database name in backend/.env (DATABASE_URL). Change the password for anything
# beyond a laptop demo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: safety
      POSTGRES_DB: safetyai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
